name: Tests

on:
  push:
    paths: ["battbrain/**", "simulator/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["battbrain/**", "simulator/**", ".github/workflows/tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: BattBrain (core + app)
        working-directory: battbrain/app
        run: python -m unittest discover -s tests -v
      - name: Simulator
        working-directory: simulator
        run: python -m unittest discover -s tests -v
