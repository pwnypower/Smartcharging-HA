name: BattBrain
version: "1.0.0"
slug: battbrain
description: Onafhankelijke, open-source planner en sturing voor je thuisbatterij
url: https://github.com/pwnypower/Smartcharging-HA/tree/main/battbrain
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-heart-variant
panel_title: BattBrain
homeassistant_api: true
options:
  soc_entity: ""
  price_entity: ""
  price_attribute: prices
  solar_today_entity: ""
  solar_remaining_entity: ""
  solar_tomorrow_entity: ""
  grid_power_entity: ""
  solar_power_entity: ""
  battery_power_entity: ""
  reserve_switch_entity: ""
  target_soc_entity: ""
  load_power_entity: ""
  grid_power_sign: 1
  battery_power_sign: 1
  battery_capacity_kwh: 5.1
  max_power_kw: 3.0
  reserve_soc: 15
  saldering_end: "2026-12-31"
  export_deduction: 0.15
  latitude: 0
  longitude: 0
  history_days: 14
  control_mode: advice
  max_charge_price: 0.40
  min_switch_minutes: 10
  conflict_automation: ""
  auto_detect: true
  backtest_days: 7
  demo: false
schema:
  soc_entity: str?
  price_entity: str?
  price_attribute: str
  solar_today_entity: str?
  solar_remaining_entity: str?
  solar_tomorrow_entity: str?
  grid_power_entity: str?
  solar_power_entity: str?
  battery_power_entity: str?
  reserve_switch_entity: str?
  target_soc_entity: str?
  load_power_entity: str?
  grid_power_sign: list(1|-1)
  battery_power_sign: list(1|-1)
  battery_capacity_kwh: float(0.5,200)
  max_power_kw: float(0.1,50)
  reserve_soc: int(0,100)
  saldering_end: str
  export_deduction: float(0,1)
  latitude: float
  longitude: float
  history_days: int(1,60)
  control_mode: list(advice|control)
  max_charge_price: float(0,2)
  min_switch_minutes: int(1,120)
  conflict_automation: str?
  auto_detect: bool
  backtest_days: int(1,30)
  demo: bool
