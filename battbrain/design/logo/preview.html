<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
body { background:#050d09; display:flex; flex-direction:column; align-items:center; gap:40px; padding:60px; font-family:sans-serif; }
.row { display:flex; gap:40px; align-items:center; }
.bg-dark { background:#050d09; padding:40px; border-radius:20px; }
.bg-mid  { background:#0a1a14; padding:40px; border-radius:20px; border:1px solid rgba(47,208,122,0.15); }
.bg-light{ background:#ecf3ee; padding:40px; border-radius:20px; }
label { color:#9fb6ab; font-size:13px; text-align:center; display:block; margin-top:10px; }
</style>
</head>
<body>
<div class="row">
  <div class="bg-dark">
    <img src="battbrain-logo.svg" width="210" height="135"/>
    <label>Logo mark — donker</label>
  </div>
  <div class="bg-mid">
    <img src="battbrain-icon.svg" width="150" height="150"/>
    <label>App icon — 150px</label>
  </div>
</div>
<div class="bg-dark">
  <img src="battbrain-wordmark.svg" width="280" height="60"/>
  <label>Wordmark</label>
</div>
<div class="bg-dark" style="display:flex;gap:30px;align-items:center;">
  <img src="battbrain-icon.svg" width="80" height="80"/>
  <img src="battbrain-icon.svg" width="48" height="48"/>
  <img src="battbrain-icon.svg" width="32" height="32"/>
  <img src="battbrain-icon.svg" width="24" height="24"/>
  <label style="color:#6a847a;">Schaal test: 80 / 48 / 32 / 24 px</label>
</div>
</body>
</html>
